site_name: Deck Crafter
site_description: Documentation for Deck Crafter
site_author: jparisu
repo_url: https://github.com/jparisu/deck-crafter
repo_name: deck-crafter
edit_uri: edit/main/docs/

theme:
  name: readthedocs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_source: true
  - include-markdown

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting Started: getting-started.md
  - Visual Interface: visual-interface.md
  - App Interface: app-interface.md
  - Configuration Format: configuration-format.md
  - Development: development.md
  - Changelog: changelog.md
  - API:
      - Overview: api/index.md
      - Core Models: api/core.md
      - Rendering: api/rendering.md
      - Application: api/interface.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jparisu/deck-crafter
