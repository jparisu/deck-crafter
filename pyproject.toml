[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "deck-crafter"
version = "0.1.0"
description = "Deck Crafter"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "jparisu", email = "javier.paris.u@gmail.com" },
]
keywords = ["cards", "deck", "pdf", "latex", "yaml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "PyYAML>=6.0",

  # Add your shared internal utils dependency here, for example:
  # "your-org-utils>=0.1.0",

]

[project.urls]
Homepage = "https://github.com/jparisu/deck-crafter"
Repository = "https://github.com/jparisu/deck-crafter"
Issues = "https://github.com/jparisu/deck-crafter/issues"


[project.scripts]
deck-crafter = "apps.deck_crafter_cli:main"


[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "coverage[toml]>=7.8.0",
  "mkdocs>=1.6.0",
  "mkdocs-include-markdown-plugin>=7.0.0",
  "mkdocs-material>=9.6.0",
  "mkdocstrings[python]>=0.30.0",
  "mypy>=1.15.0",
  "pre-commit>=4.2.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.1.0",
  "ruff>=0.11.0",
  "twine>=6.1.0",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-include-markdown-plugin>=7.0.0",
  "mkdocs-material>=9.6.0",
  "mkdocstrings[python]>=0.30.0",
]
lint = [
  "mypy>=1.15.0",
  "ruff>=0.11.0",
]
test = [
  "pytest>=8.3.0",
  "pytest-cov>=6.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deck_crafter", "apps"]
include = ["src/deck_crafter/templates/*.template"]

[tool.hatch.build.targets.sdist]
include = [
  "src/deck_crafter/templates/*.template",
  "examples/**",
  "resources/**",
  "docs/**",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
ignore = [
  "UP046",
  "UP047",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
packages = ["deck_crafter"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["deck_crafter"]

[tool.coverage.report]
show_missing = true
skip_covered = false
